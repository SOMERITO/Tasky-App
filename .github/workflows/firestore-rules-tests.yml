name: Firestore and authentication integration tests

on:
  push:
    branches:
      - feature/tasky-multi-workspace-foundation
    paths:
      - "firebase/**"
      - "tests/**"
      - "app.js"
      - "tasky-auth.js"
      - "tasky-family.js"
      - "index.html"
      - "styles.css"
      - "tasky-family.js"
      - "index.html"
      - "styles.css"
      - "tasky-firebase-config.js"
      - "tasky-private-data.js"
      - "tasky-private-modules.js"
      - "firebase/emulator/sync-safety.firebase.json"
      - "firebase/emulator/firestore.sync-safety.rules"
      - ".github/workflows/firestore-rules-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "firebase/**"
      - "tests/**"
      - "app.js"
      - "tasky-auth.js"
      - "tasky-private-data.js"
      - "tasky-private-modules.js"
      - "firebase/emulator/sync-safety.firebase.json"
      - "firebase/emulator/firestore.sync-safety.rules"
      - ".github/workflows/firestore-rules-tests.yml"

permissions:
  contents: read

jobs:
  emulator-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install isolated test dependencies
        working-directory: firebase/emulator
        run: npm install --no-audit --no-fund

      - name: Install Chromium for browser integration tests
        working-directory: firebase/emulator
        run: npx playwright install --with-deps chromium

      - name: Run Firestore rules and authentication browser tests
        working-directory: firebase/emulator
        run: npm test


      - name: Package exact repository snapshot for review
        if: success()
        run: |
          archive="$RUNNER_TEMP/Tasky-App-${GITHUB_SHA}.zip"
          git archive --format=zip --prefix="Tasky-App-${GITHUB_SHA}/" HEAD > "$archive"
          sha256sum "$archive" | tee "$RUNNER_TEMP/Tasky-App-${GITHUB_SHA}.sha256"

      - name: Upload repository review archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tasky-App-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Tasky-App-${{ github.sha }}.zip
            ${{ runner.temp }}/Tasky-App-${{ github.sha }}.sha256
          if-no-files-found: error
          retention-days: 7
