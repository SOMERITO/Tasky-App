name: Firestore multi-workspace rules

on:
  push:
    branches:
      - feature/tasky-multi-workspace-foundation
    paths:
      - "firebase/**"
      - "tests/**"
      - "app.js"
      - "tasky-private-data.js"
      - "tasky-private-modules.js"
      - ".github/workflows/firestore-rules-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "firebase/**"
      - "tests/**"
      - "app.js"
      - "tasky-private-data.js"
      - "tasky-private-modules.js"
      - ".github/workflows/firestore-rules-tests.yml"

permissions:
  contents: read

jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Install isolated test dependencies
        working-directory: firebase/emulator
        run: npm install --no-audit --no-fund

      - name: Run Firestore rules tests against emulator
        working-directory: firebase/emulator
        run: npm test
