# TASKY · V73 · VITE MIGRATION
# Build de validación.
# Este workflow NO publica la aplicación.
# Su única función es comprobar que Tasky pueda compilar correctamente.

name: Tasky - Build Vite

on:
  push:
    branches:
      - vite-migration

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Tasky
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # 1. Descargar el repositorio
      # ----------------------------------------
      - name: Descargar código
        uses: actions/checkout@v5

      # ----------------------------------------
      # 2. Configurar Node.js
      # ----------------------------------------
      # No usamos cache todavía porque aún no
      # tenemos package-lock.json.
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # ----------------------------------------
      # 3. Instalar dependencias
      # ----------------------------------------
      # npm install funciona aunque todavía no
      # exista package-lock.json.
      - name: Instalar dependencias
        run: npm install

      # ----------------------------------------
      # 4. Compilar aplicación
      # ----------------------------------------
      - name: Compilar Vite
        run: npm run build

      # ----------------------------------------
      # 5. Verificar resultado
      # ----------------------------------------
      - name: Verificar archivos generados
        run: |
          test -f dist/index.html
          test -f dist/quotes.json
          test -f dist/manifest.json
          test -f dist/sw.js
          test -f dist/icon.png

          echo "======================================"
          echo "TASKY V73 · VITE BUILD: OK"
          echo "======================================"

          echo "Contenido de dist:"
          find dist -maxdepth 2 -type f | sort
