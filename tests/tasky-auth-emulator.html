<!doctype html>
<html lang="es" class="tasky-booting tasky-auth-required">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tasky · Prueba aislada de acceso</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; }
    input, button { box-sizing: border-box; width: 100%; padding: .75rem; margin-top: .4rem; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }
    #tasky-boot-screen { display: none; }
    html.tasky-booting #tasky-boot-screen { display: block; }
    select, input { font: inherit; }
    select { width: 100%; padding: .75rem; margin-top: .4rem; }
    .tasky-profile-picker { margin-bottom: 1rem; }
    #tasky-auth-message { min-height: 1.5rem; }
  </style>
  <link rel="stylesheet" href="../styles.css?v=20261122-leah-balanced-dashboard-6">
</head>
<body>
  <div id="tasky-boot-screen" role="status">Cargando tu espacio…</div>
  <button id="btn-tasky-account" type="button" hidden>Tasky</button>
  <main id="tasky-auth-gate" role="dialog" aria-modal="true">
    <h1 id="tasky-auth-title">Bienvenido a Tasky</h1>
    <form id="tasky-login-form" novalidate>
      <section id="tasky-login-credentials">
        <h2>Ingresa a Tasky</h2>
        <label for="tasky-login-email">Correo electrónico</label>
        <input id="tasky-login-email" name="email" type="email" autocomplete="username" required>
        <label for="tasky-login-password">Contraseña</label>
        <input id="tasky-login-password" name="password" type="password" autocomplete="current-password" required>
        <button id="tasky-password-reset" type="button">Olvidé mi contraseña</button>
      </section>
      <section id="tasky-profile-picker" class="tasky-profile-picker" hidden>
        <h2 id="tasky-profile-picker-title">Elige tu espacio</h2>
        <label id="tasky-profile-select-label" for="tasky-profile-select">Espacio</label>
        <select id="tasky-profile-select" required>
          <option value="">Selecciona un espacio</option>
        </select>
      </section>
      <button id="tasky-login-submit" type="submit">Iniciar sesión</button>
    </form>
    <button id="tasky-auth-signout" type="button" hidden>Cerrar sesión</button>
    <p id="tasky-auth-message" role="status" aria-live="polite"></p>
  </main>
  <output id="tasky-test-result" aria-live="polite"></output>
  <output id="tasky-test-greeting" aria-live="polite"></output>
  <div class="top-actions" aria-label="Acciones de Tasky">
    <button id="tasky-child-tasks-shortcut" type="button" hidden>Mis tareas</button>
  </div>
  <div id="tasky-child-readonly-banner" hidden></div>
  <section id="tasky-family-panel" class="tasky-family-panel" hidden aria-label="Mis tareas de Leah">
    <div id="tasky-family-content"></div>
  </section>
  <script>
    window.__TASKY_USE_FIREBASE_EMULATORS__ = true;
    window.addEventListener("tasky:workspace-ready", (event) => {
      // Mirror the real app shell: once Firebase validates a workspace, leave
      // the boot/auth-hidden state before checking the rendered page.
      document.documentElement.classList.remove("tasky-booting", "tasky-auth-required");
      document.documentElement.dataset.taskyWorkspace = event.detail.workspaceId;
      document.documentElement.dataset.taskyRole = event.detail.role;
      document.getElementById("tasky-test-result").textContent =
        event.detail.workspaceName + " · " + event.detail.role;
      document.getElementById("tasky-test-greeting").textContent = event.detail.displayName;
      const accountButton = document.getElementById("btn-tasky-account");
      accountButton.hidden = false;
      accountButton.textContent = event.detail.workspaceName;
    });
  </script>
  <script src="../tasky-firebase-config.js?v=20261120-firebase-env-1"></script>
  <script type="module" src="../tasky-auth.js?v=20261120-auth-first-1"></script>
  <script type="module" src="../tasky-family.js?v=emulator-family-test"></script>

</body>
</html>
