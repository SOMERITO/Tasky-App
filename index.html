<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- ==========================================
         TASKY - PRO EDITION 
         Versión: 20.0 (Pure Firebase Architecture)
         Actualizaciones: 
         - Eliminación total de JSONBin (Causa de la condición de carrera).
         - Carga inicial gestionada 100% por WebSockets (0 delays).
         - Bloqueo "isRendering" para evitar auto-borrados del DOM.
         ========================================== -->
    <title>Tasky</title>
    
    <link rel="icon" type="image/png" href="icon.png?v=20">
    <link rel="apple-touch-icon" href="icon.png?v=20">
    <link rel="manifest" href="manifest.json?v=20">
    <meta name="theme-color" content="#1C1C1E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- Librerías Externas -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --system-blue: #007AFF; --system-red: #FF3B30; --system-orange: #FF9500;
            --system-green: #34C759; --system-gray: #8E8E93; --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1C1C1E; --text-muted: #8E8E93; --radius-lg: 24px; --radius-md: 16px;
            --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); --bounce: cubic-bezier(0.34, 1.56, 0.64, 1); 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            color: var(--text-main); display: flex; justify-content: center;
            min-height: 100vh; padding: 40px 20px 140px 20px;
            background: linear-gradient(-45deg, #FFB3BA, #FFDFBA, #BAFFC9, #BAE1FF, #E0C3FC, #FFC3A0);
            background-size: 600% 600%; animation: moveBackground 25s ease-in-out infinite; background-attachment: fixed;
        }

        @keyframes moveBackground { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .loading-overlay.hidden { opacity: 0; visibility: hidden; }
        
        .ios-spinner {
            width: 48px; height: 48px; margin-bottom: 20px;
            border: 4px solid rgba(0, 122, 255, 0.15); border-top-color: var(--system-blue);
            border-radius: 50%; animation: iosSpin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }
        @keyframes iosSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { font-size: 1.15rem; font-weight: 700; color: var(--system-blue); letter-spacing: -0.5px; }

        .container { width: 100%; max-width: 750px; }

        .header-controls { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 15px; position: relative; z-index: 100;}
        
        .btn-overdue {
            background: rgba(255, 255, 255, 0.8); padding: 8px 16px; border-radius: 20px;
            font-size: 0.95rem; font-weight: 700; color: var(--system-red);
            backdrop-filter: blur(15px); border: 1px solid rgba(255, 59, 48, 0.2);
            display: none; align-items: center; gap: 6px; box-shadow: 0 8px 20px rgba(255, 59, 48, 0.15);
            cursor: pointer; transition: transform 0.2s var(--bounce);
        }
        .btn-overdue:active { transform: scale(0.92); }

        h1 {
            font-size: 4.2rem; font-weight: 800; text-align: center; margin-bottom: 30px;
            background: linear-gradient(90deg, #007AFF, #5856D6, #FF2D55, #FF9500, #34C759, #007AFF);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: gradientTitle 6s linear infinite; letter-spacing: -2px;
        }
        @keyframes gradientTitle { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--system-gray); animation: slideUpFade 0.6s var(--bounce) both; }
        .empty-state svg { opacity: 0.4; margin-bottom: 20px; }
        .empty-state h3 { font-size: 1.5rem; margin-bottom: 10px; color: var(--text-main); font-weight: 700; }

        .activity-card {
            background: var(--card-bg); border-radius: var(--radius-lg); padding: 24px 30px; margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.8);
            animation: slideUpFade 0.5s var(--bounce) both; transform: translate3d(0,0,0);
        }
        @keyframes slideUpFade { from { opacity: 0; transform: translate3d(0, 30px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }

        .sortable-ghost-card { opacity: 0.4; background: var(--system-gray); border-radius: var(--radius-lg); transform: scale(0.98); }
        .sortable-ghost-task { height: 4px !important; padding: 0 !important; margin: 4px 0 !important; background-color: var(--system-blue) !important; border: none !important; border-radius: 4px !important; overflow: hidden !important; box-shadow: 0 0 12px var(--system-blue) !important;}
        .sortable-ghost-task * { display: none !important; } 
        
        .sortable-drag { cursor: grabbing !important; box-shadow: 0 25px 50px rgba(0,0,0,0.2) !important; opacity: 0.95; transform: scale(1.04) rotate(1deg) translate3d(0,0,0) !important; z-index: 999;}
        .selected-task { background-color: rgba(0, 122, 255, 0.12) !important; border-color: var(--system-blue) !important; transform: scale(1.02); }

        .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 15px; }
        .card-drag-handle { cursor: grab; color: var(--text-muted); padding: 5px; transition: var(--transition); flex-shrink: 0; touch-action: none; }
        .activity-title { flex-grow: 1; font-size: 1.45rem; font-weight: 800; color: var(--text-main); border: none; background: transparent; outline: none; letter-spacing: -0.5px;}
        .header-actions { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }

        .progress-container { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .progress-bar-bg { flex-grow: 1; height: 6px; background: rgba(0,0,0,0.08); border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: var(--system-blue); border-radius: 10px; transition: width 0.8s var(--bounce); }
        .progress-text { font-size: 0.85rem; font-weight: 700; color: var(--system-gray); }

        .stats-panel {
            background: rgba(255, 255, 255, 0.5); border-radius: var(--radius-md); max-height: 0; overflow: hidden; opacity: 0; margin-bottom: 0;
            transition: max-height 0.4s var(--bounce), opacity 0.3s, margin 0.4s, padding 0.4s; display: flex; flex-direction: column;
        }
        .stats-panel.open { max-height: 180px; opacity: 1; padding: 15px; margin-bottom: 15px; border: 1px solid rgba(0,0,0,0.05); }
        .stats-grid { display: flex; justify-content: space-between; text-align: center; margin-bottom: 12px; }
        .stat-box { display: flex; flex-direction: column; width: 30%; }
        .stat-value { font-size: 1.6rem; font-weight: 800; color: var(--system-blue); }
        .stat-label { font-size: 0.75rem; font-weight: 600; color: var(--system-gray); text-transform: uppercase; letter-spacing: 0.5px;}
        .stat-msg { font-size: 0.95rem; font-weight: 500; color: var(--text-main); text-align: center; background: rgba(0,0,0,0.05); padding: 10px; border-radius: 10px; }

        .task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
        .task-item {
            display: flex; align-items: flex-start; background: rgba(255, 255, 255, 0.95); border-radius: var(--radius-md); padding: 12px 10px;
            border: 1px solid rgba(255, 255, 255, 0.6); transition: border 0.3s, transform 0.3s var(--bounce), box-shadow 0.3s;
            transform: translate3d(0,0,0);
        }
        .task-item.is-critical { background: rgba(255, 59, 48, 0.05); border: 1px solid rgba(255, 59, 48, 0.3); }
        .task-item.is-critical .task-input { font-weight: 600; color: var(--system-red); }
        .task-item:focus-within:not(.selected-task) { background: #FFFFFF; box-shadow: 0 8px 20px rgba(0,0,0,0.08); transform: scale(1.02); z-index: 2; border-color: var(--system-blue);}

        .drag-handle { cursor: grab; color: #D1D5DB; padding: 6px 8px; margin-top: 0px; flex-shrink: 0; transition: color 0.2s; touch-action: none; }
        .drag-handle:active { cursor: grabbing; color: var(--system-blue); }
        
        .btn-priority { background: transparent; border: none; cursor: pointer; font-size: 1.2rem; color: #D1D5DB; margin-right: 6px; padding-top: 2px; transition: transform 0.3s var(--bounce);}
        .is-critical .btn-priority { transform: scale(1.15); }

        .btn-check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #C7C7CC; background: transparent; cursor: pointer; margin-right: 12px; flex-shrink: 0; margin-top: 2px; transition: transform 0.2s var(--bounce), border-color 0.2s, background 0.2s; }
        .btn-check:active { transform: scale(0.7); }
        
        .task-input { flex-grow: 1; border: none; padding: 4px; font-size: 1.05rem; color: var(--text-main); background: transparent; outline: none; resize: none; overflow: hidden; font-family: inherit; line-height: 1.4; transition: height 0.2s ease; }
        .task-input::placeholder { color: #C7C7CC; }
        .btn-icon { background: transparent; border: none; cursor: pointer; padding: 6px; color: var(--system-gray); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: color 0.2s, background 0.2s; }
        .btn-icon:hover { background: rgba(0,0,0,0.05); color: var(--system-red); }

        .completed-card { background: rgba(255,255,255,0.4); border: 1px dashed rgba(0,0,0,0.15); box-shadow: none; }
        .task-item.completed { background: transparent; border: none; border-bottom: 1px solid rgba(0,0,0,0.05); border-radius: 0; box-shadow: none; transform: none;}
        .task-item.completed .task-input { text-decoration: line-through; color: var(--system-gray); }
        .task-item.completed .drag-handle, .task-item.completed .btn-priority { display: none; }
        .task-item.completed .btn-check { background: var(--system-blue); border-color: var(--system-blue); position: relative; }
        @keyframes checkDraw { 0% { width: 0; height: 0; opacity: 0;} 100% { width: 5px; height: 11px; opacity: 1;} }
        .task-item.completed .btn-check::after { content: ''; position: absolute; left: 7px; top: 4px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); animation: checkDraw 0.4s var(--bounce) forwards; }

        .fab-wrapper { position: fixed; bottom: 40px; right: 40px; z-index: 1000; display: flex; flex-direction: column-reverse; align-items: center; gap: 15px; }
        .fab-btn { border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; box-shadow: 0 10px 25px rgba(0,0,0,0.2); transition: transform 0.3s var(--bounce); }
        .fab-main { width: 68px; height: 68px; background: var(--system-blue); z-index: 2; }
        .fab-main:hover { transform: scale(1.08); }
        .fab-sub { width: 52px; height: 52px; opacity: 0; visibility: hidden; transform: translateY(20px) scale(0.5); z-index: 1; position: absolute; }
        .fab-wrapper.active .fab-main svg { transform: rotate(135deg); transition: 0.3s; } 
        .fab-wrapper.active .fab-sub { opacity: 1; visibility: visible; transform: translateY(0) scale(1); transition: 0.3s var(--bounce); }
        .fab-wrapper.active .fab-sub:nth-child(2) { bottom: 85px; }
        .fab-wrapper.active .fab-sub:nth-child(3) { bottom: 150px; transition-delay: 0.05s; }
        .bg-green { background: var(--system-green); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: var(--transition); z-index: 2000;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: var(--card-bg); border-radius: var(--radius-lg); padding: 30px;
            width: 90%; max-width: 450px; max-height: 80vh; overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); transform: scale(0.9); transition: transform 0.4s var(--bounce);
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .overdue-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: rgba(255,255,255,0.9); border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(255,59,48,0.3); }
        .overdue-text { flex-grow: 1; font-weight: 600; font-size: 1.05rem; margin-right: 10px;}
        .overdue-date { font-size: 0.8rem; color: var(--system-red); display: block; margin-top: 4px; font-weight: 500;}
        .overdue-actions button { background: var(--system-blue); border: none; color: white; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
        .overdue-actions button:active { transform: scale(0.95); }
        .overdue-actions button.del { background: rgba(255,59,48,0.1); color: var(--system-red); margin-right: 8px; }

        @media (max-width: 768px) {
            body { padding: 20px 15px 140px 15px; }
            .activity-card { padding: 20px 15px; }
            .fab-wrapper { bottom: 25px; right: 25px; }
            .fab-main { width: 60px; height: 60px; }
            .drag-handle { display: flex; padding: 8px; }
        }
    </style>
</head>
<body>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="ios-spinner"></div>
        <div class="loading-text">Conectando a la Nube...</div>
    </div>

    <div class="container">
        <div class="header-controls">
            <div class="btn-overdue" id="btnOverdue" onclick="openOverdueModal()">
                ⚠️ <span id="overdueCount">0</span> Atrasadas
            </div>
        </div>

        <h1>Tasky</h1>

        <div id="empty-state" class="empty-state" style="display: none;">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
            </svg>
            <h3>Todo limpio por aquí ✨</h3>
            <p>Toca el botón azul inferior para crear tu primera fase.</p>
        </div>
        
        <div id="activities-container"></div>

        <div id="completed-container" class="activity-card completed-card" style="display: none;">
            <div class="activity-header">
                <div class="title-row"><h2 class="activity-title" readonly>✅ Completadas de Hoy</h2></div>
            </div>
            <div class="task-list" id="global-completed-list"></div>
        </div>
        
        <div class="fab-wrapper" id="fabMenu">
            <button class="fab-btn fab-main" onclick="toggleFabMenu()">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <button class="fab-btn fab-sub bg-blue" onclick="addActivity(); toggleFabMenu();" style="background: var(--system-blue);" title="Nueva Fase">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <button class="fab-btn fab-sub bg-green" onclick="copyToWhatsApp(); toggleFabMenu();" title="Copiar WhatsApp">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
            </button>
        </div>
    </div>

    <!-- Modal Tareas Atrasadas -->
    <div class="modal-overlay" id="overdueModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px; color: var(--text-main); font-weight: 800;">⚠️ Atrasadas</h2>
            <div id="overdueList"></div>
            <button onclick="closeOverdueModal()" style="width:100%; padding: 14px; background:var(--system-gray); color:white; border:none; border-radius:12px; margin-top:15px; font-weight:700; cursor:pointer; font-size: 1.05rem;">Cerrar</button>
        </div>
    </div>

    <script>
        // FIREBASE INITIALIZATION
        const firebaseConfig = {
            apiKey: "AIzaSyBCiHv2iS76-q4y3WHgdrJ2zW5YrhvEcb8",
            authDomain: "tasky-7a30c.firebaseapp.com",
            projectId: "tasky-7a30c",
            storageBucket: "tasky-7a30c.firebasestorage.app",
            messagingSenderId: "505071526437",
            appId: "1:505071526437:web:6c9eb46dbb4fef296655cc"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const taskyDoc = db.collection('workspace').doc('main_board');

        let overdueTasksDB = [];
        let isAppLoaded = false; 
        let isRendering = false; // CANDADO ACTIVO: Evita borrar la nube mientras carga
        let currentDataString = ""; 
        let isUserTyping = false; 
        let pendingRemoteUpdate = null; 
        let cloudSyncTimer;

        if (typeof Sortable !== 'undefined' && typeof Sortable.MultiDrag !== 'undefined') Sortable.mount(new Sortable.MultiDrag());

        // FOCUS TRACKER
        document.addEventListener('focusin', (e) => { 
            if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') isUserTyping = true; 
        });
        
        document.addEventListener('focusout', (e) => { 
            if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') { 
                isUserTyping = false; 
                // Aplicar actualización pendiente de la nube si llegó mientras escribíamos
                if (pendingRemoteUpdate) {
                    currentDataString = pendingRemoteUpdate;
                    renderData(pendingRemoteUpdate);
                    pendingRemoteUpdate = null;
                }
            } 
        });

        document.addEventListener('input', (e) => {
            if(e.target.classList.contains('task-input')) { autoResizeTextarea(e.target); updateLogic(); }
            clearTimeout(cloudSyncTimer);
            cloudSyncTimer = setTimeout(() => { saveDataLocalAndCloud(); }, 800);
        });

        // ==========================================
        // MOTOR EN TIEMPO REAL (onSnapshot)
        // ==========================================
        taskyDoc.onSnapshot((doc) => {
            if (doc.exists) {
                const dataStr = JSON.stringify(doc.data());
                
                if (dataStr === currentDataString) {
                    hideLoading();
                    return; 
                }
                
                if (isUserTyping) {
                    pendingRemoteUpdate = dataStr;
                } else {
                    currentDataString = dataStr;
                    localStorage.setItem('tasky_pro_v20', dataStr);
                    renderData(dataStr);
                }
            } else {
                taskyDoc.set({ categories: [], completed: [] });
            }
            hideLoading();
        }, (error) => {
            const localData = localStorage.getItem('tasky_pro_v20');
            if (localData) renderData(localData);
            hideLoading();
        });

        function hideLoading() {
            if (!isAppLoaded) {
                isAppLoaded = true;
                setTimeout(() => { document.getElementById('loadingOverlay').classList.add('hidden'); }, 400);
            }
        }

        function getTodayString() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
        function autoResizeTextarea(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight) + 'px'; }
        function toggleFabMenu() { document.getElementById('fabMenu').classList.toggle('active'); }

        function renderData(dataStr) {
            isRendering = true; // ACTIVAR CANDADO
            document.getElementById('activities-container').innerHTML = '';
            overdueTasksDB = [];
            const today = getTodayString();

            if (dataStr && dataStr.length > 20) {
                const data = JSON.parse(dataStr);
                if(data.categories) {
                    data.categories.forEach((cat) => {
                        const card = addActivity(cat.title, false, cat.id);
                        const list = card.querySelector('.task-list');
                        
                        cat.tasks.forEach(task => {
                            if (task.date < today && !task.critical) {
                                overdueTasksDB.push({ ...task, originCat: cat.id });
                            } else {
                                const input = createTaskElement(list, null, task.date);
                                input.value = task.text;
                                if(task.critical) input.closest('.task-item').classList.add('is-critical');
                                setTimeout(()=> autoResizeTextarea(input), 0);
                            }
                        });
                        createTaskElement(list, null, today); 
                    });
                }
            } else {
                addActivity('☀️ Fase 1: Mañana');
            }
            
            updateOverdueUI();
            updateLogic();
            
            new Sortable(document.getElementById('activities-container'), {
                animation: 350, handle: '.card-drag-handle', forceFallback: true, 
                onEnd: function() { saveDataLocalAndCloud(); }
            });
            
            isRendering = false; // LIBERAR CANDADO
        }

        function toggleStats(btn) {
            const panel = btn.closest('.activity-card').querySelector('.stats-panel');
            panel.classList.toggle('open');
            if(panel.classList.contains('open')) btn.style.color = 'var(--system-blue)';
            else btn.style.color = 'var(--system-gray)';
        }

        function updateOverdueUI() {
            const btn = document.getElementById('btnOverdue');
            if (overdueTasksDB.length > 0) {
                btn.style.display = 'flex';
                document.getElementById('overdueCount').innerText = overdueTasksDB.length;
            } else btn.style.display = 'none';
        }

        function openOverdueModal() {
            const list = document.getElementById('overdueList');
            list.innerHTML = '';
            overdueTasksDB.forEach((task, index) => {
                list.innerHTML += `
                    <div class="overdue-item">
                        <div class="overdue-text">${task.text} <span class="overdue-date">Creada: ${task.date}</span></div>
                        <div class="overdue-actions">
                            <button class="del" onclick="discardOverdue(${index})">✖</button>
                            <button onclick="moveToToday(${index})">A Hoy</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('overdueModal').classList.add('active');
        }

        function closeOverdueModal() { document.getElementById('overdueModal').classList.remove('active'); }

        function discardOverdue(index) {
            overdueTasksDB.splice(index, 1);
            saveDataLocalAndCloud();
            openOverdueModal(); updateOverdueUI();
            if(overdueTasksDB.length === 0) closeOverdueModal();
        }

        function moveToToday(index) {
            const task = overdueTasksDB[index];
            overdueTasksDB.splice(index, 1);
            
            let targetCard = document.getElementById(task.originCat) || document.querySelector('.activity-card:not(.completed-card)');
            if(targetCard) {
                const list = targetCard.querySelector('.task-list');
                const input = createTaskElement(list, null, getTodayString());
                input.value = task.text;
                if(task.critical) input.closest('.task-item').classList.add('is-critical');
                setTimeout(()=> autoResizeTextarea(input), 0);
            }
            
            saveDataLocalAndCloud();
            openOverdueModal(); updateOverdueUI(); updateLogic();
            if(overdueTasksDB.length === 0) closeOverdueModal();
        }

        function saveDataLocalAndCloud() {
            if (!isAppLoaded || isRendering) return; // PROHIBE GUARDAR MIENTRAS SE CONSTRUYE EL DOM

            const dataObj = { categories: [], completed: [] };
            document.querySelectorAll('.activity-card:not(.completed-card)').forEach(card => {
                const title = card.querySelector('.activity-title').value;
                const tasks = [];
                card.querySelectorAll('.task-item:not(.completed)').forEach(t => {
                    const text = t.querySelector('.task-input').value;
                    if(text.trim() !== '') {
                        tasks.push({ text, date: t.dataset.date, critical: t.classList.contains('is-critical') });
                    }
                });
                const cardOverdue = overdueTasksDB.filter(o => o.originCat === card.id);
                dataObj.categories.push({ id: card.id, title, tasks: [...tasks, ...cardOverdue] });
            });
            
            const dataStr = JSON.stringify(dataObj);
            if (dataStr === currentDataString) return; 
            
            currentDataString = dataStr; 
            localStorage.setItem('tasky_pro_v20', dataStr); 

            taskyDoc.set(dataObj).catch(e => console.error(e));
        }

        function updateLogic() {
            const container = document.getElementById('activities-container');
            const emptyState = document.getElementById('empty-state');
            if(container.querySelectorAll('.activity-card').length === 0) emptyState.style.display = 'block';
            else emptyState.style.display = 'none';

            document.querySelectorAll('.activity-card:not(.completed-card)').forEach(card => {
                const tasks = card.querySelectorAll('.task-item:not(.completed)');
                let pendingCount = 0;
                tasks.forEach(t => { if(t.querySelector('.task-input').value.trim() !== '') pendingCount++; });
                
                const cardId = card.id;
                const completedCount = document.querySelectorAll(`.task-item.completed[data-origin-id="${cardId}"]`).length;
                const total = pendingCount + completedCount;

                const progressText = card.querySelector('.progress-text');
                const progressFill = card.querySelector('.progress-bar-fill');
                if(progressText) progressText.innerText = `${completedCount}/${total}`;
                let percent = total === 0 ? 0 : Math.round((completedCount / total) * 100);
                if(progressFill) progressFill.style.width = `${percent}%`;

                const statsPanel = card.querySelector('.stats-panel');
                if (statsPanel) {
                    statsPanel.querySelector('.stat-total').innerText = total;
                    statsPanel.querySelector('.stat-completed').innerText = completedCount;
                    statsPanel.querySelector('.stat-percent').innerText = `${percent}%`;
                    
                    let msg = "Añade tareas para iniciar.";
                    if(percent === 100 && total > 0) msg = "¡Fase completada! Excelente ritmo. 🚀";
                    else if (percent >= 50) msg = "¡Ya pasaste la mitad, sigue así! 🔥";
                    else if (percent > 0) msg = "Buen inicio, mantén el enfoque. 🎯";
                    else if (total > 0) msg = "¡Es hora de empezar con esta fase! 💪";
                    statsPanel.querySelector('.stat-msg').innerText = msg;
                }
            });
        }

        function togglePriority(btn) { 
            const task = btn.closest('.task-item'); task.classList.toggle('is-critical'); 
            if(navigator.vibrate) navigator.vibrate(30);
            saveDataLocalAndCloud(); 
        }

        let activityCounter = 0;
        function addActivity(title = '', createEmptyTask = true, forceId = null) {
            activityCounter++;
            const container = document.getElementById('activities-container');
            const card = document.createElement('div');
            card.className = 'activity-card'; card.id = forceId || 'activity-' + activityCounter;
            card.innerHTML = `
                <div class="activity-header">
                    <div class="title-row">
                        <div class="card-drag-handle" title="Mover Sección"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="9" cy="5" r="1.5"/><circle cx="15" cy="5" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="15" cy="19" r="1.5"/></svg></div>
                        <input type="text" class="activity-title" value="${title}" placeholder="Fase o Bloque...">
                        <div class="header-actions">
                            <button class="btn-icon" onclick="toggleStats(this)" title="Ver Análisis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="22" height="22" stroke-width="2.5"><path d="M18 20V10M12 20V4M6 20v-6"/></svg></button>
                            <button class="btn-icon" onclick="this.closest('.activity-card').remove(); updateLogic(); saveDataLocalAndCloud();"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="22" height="22" stroke-width="2.5"><path d="M6 18L18 6M6 6l12 12"/></svg></button>
                        </div>
                    </div>
                    <div class="progress-container"><div class="progress-bar-bg"><div class="progress-bar-fill"></div></div><span class="progress-text">0/0</span></div>
                    
                    <div class="stats-panel">
                        <div class="stats-grid">
                            <div class="stat-box"><span class="stat-value stat-total">0</span><span class="stat-label">Total</span></div>
                            <div class="stat-box"><span class="stat-value stat-completed">0</span><span class="stat-label">Listas</span></div>
                            <div class="stat-box"><span class="stat-value stat-percent">0%</span><span class="stat-label">Avance</span></div>
                        </div>
                        <div class="stat-msg"></div>
                    </div>
                </div>
                <div class="task-list"></div>
            `;
            container.appendChild(card);
            const taskList = card.querySelector('.task-list');
            
            new Sortable(taskList, {
                group: 'shared-tasks', 
                animation: 250, 
                filter: '.task-input, .btn-check, .btn-priority, .btn-remove-task',
                preventOnFilter: false,
                delay: 300, delayOnTouchOnly: true, 
                fallbackTolerance: 5, 
                ghostClass: 'sortable-ghost-task', dragClass: 'sortable-drag',
                multiDrag: true, multiDragKey: 'CTRL', selectedClass: 'selected-task',
                onChoose: function() { if(navigator.vibrate) navigator.vibrate(40); },
                onEnd: function() { updateLogic(); saveDataLocalAndCloud(); }
            });

            if(createEmptyTask) createTaskElement(taskList, null, getTodayString());
            updateLogic(); saveDataLocalAndCloud(); 
            return card;
        }

        function createTaskElement(listContainer, insertAfter = null, dateStr = null) {
            const task = document.createElement('div');
            task.className = 'task-item'; task.dataset.date = dateStr || getTodayString();
            task.innerHTML = `
                <div class="drag-handle" title="Mantener presionado para mover"><svg width="18" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="8" y1="6" x2="16" y2="6"></line><line x1="8" y1="12" x2="16" y2="12"></line><line x1="8" y1="18" x2="16" y2="18"></line></svg></div>
                <button class="btn-priority" onclick="togglePriority(this)" title="Marcar Urgente">🚩</button>
                <div class="btn-check" onclick="toggleComplete(this)"></div>
                <textarea class="task-input" rows="1" placeholder="Añadir tarea..." onkeydown="handleKeyDown(event, this)" onpaste="handlePaste(event, this)"></textarea>
                <button class="btn-icon btn-remove-task" tabindex="-1" onclick="this.parentElement.remove(); updateLogic(); saveDataLocalAndCloud();"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="20" height="20" stroke-width="2.5"><path d="M6 18L18 6M6 6l12 12"/></svg></button>
            `;
            if (insertAfter) insertAfter.after(task); else listContainer.appendChild(task);
            return task.querySelector('.task-input');
        }

        function handlePaste(event, input) {
            const text = (event.clipboardData || window.clipboardData).getData('text');
            if (text.includes('\n')) {
                event.preventDefault();
                const lines = text.split('\n').map(l => l.trim()).filter(l => l !== '');
                if (lines.length === 0) return;
                input.value = lines[0]; autoResizeTextarea(input);
                let currentItem = input.closest('.task-item');
                const list = currentItem.parentElement;
                
                for (let i = 1; i < lines.length; i++) {
                    setTimeout(() => {
                        const newInput = createTaskElement(list, currentItem, getTodayString());
                        newInput.value = lines[i]; autoResizeTextarea(newInput);
                        currentItem = newInput.closest('.task-item');
                        if (i === lines.length - 1) {
                            currentItem.querySelector('.task-input').focus();
                            updateLogic(); saveDataLocalAndCloud();
                        }
                    }, i * 30);
                }
            }
        }

        function toggleComplete(btn) {
            const taskItem = btn.closest('.task-item');
            const isCompleted = taskItem.classList.contains('completed');
            const globalList = document.getElementById('global-completed-list');
            const container = document.getElementById('completed-container');

            if(navigator.vibrate) navigator.vibrate(40);

            taskItem.style.opacity = '0'; taskItem.style.transform = 'scale(0.9)';
            setTimeout(() => {
                if (!isCompleted) {
                    taskItem.classList.add('completed');
                    taskItem.dataset.originId = taskItem.closest('.activity-card').id; 
                    taskItem.classList.remove('selected-task');
                    globalList.appendChild(taskItem); container.style.display = 'block'; 
                } else {
                    taskItem.classList.remove('completed');
                    const originCard = document.getElementById(taskItem.dataset.originId) || document.querySelector('.activity-card:not(.completed-card)');
                    if (originCard) originCard.querySelector('.task-list').appendChild(taskItem);
                    if(globalList.children.length === 0) container.style.display = 'none';
                }
                setTimeout(() => { taskItem.style.opacity = '1'; taskItem.style.transform = 'translate3d(0,0,0)'; }, 50);
                updateLogic(); saveDataLocalAndCloud(); 
            }, 250);
        }

        function handleKeyDown(e, input) {
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); if(input.closest('.task-item').classList.contains('completed')) return; 
                createTaskElement(input.closest('.task-item').parentElement, input.closest('.task-item'), getTodayString()).focus();
                updateLogic(); saveDataLocalAndCloud();
            } else if (e.key === 'Escape') {
                if (input.value.trim() === '') input.closest('.task-item').remove();
                input.blur(); updateLogic(); saveDataLocalAndCloud();
            }
        }

        function copyToWhatsApp() {
            let text = '';
            document.querySelectorAll('.activity-card:not(.completed-card)').forEach(card => {
                const title = card.querySelector('.activity-title').value.trim();
                const validTasks = Array.from(card.querySelectorAll('.task-item:not(.completed)')).filter(t => t.querySelector('.task-input').value.trim() !== '');
                if (title !== '' && validTasks.length > 0) {
                    text += `*${title}*\n`;
                    validTasks.forEach((task, i) => text += `${i + 1}. ${task.classList.contains('is-critical') ? '🚨 *'+task.querySelector('.task-input').value.trim()+'*' : task.querySelector('.task-input').value.trim()}\n`);
                    text += `\n`; 
                }
            });
            if(text.trim() === '') return;
            navigator.clipboard.writeText(text.trim());
        }
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
        }
    </script>
</body>
</html>
